<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Oriel render bench</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Render bench</h1>
    <span id="renderer" class="pill">…</span>
    <button id="run">Run again</button>
    <button id="power" title="The device's power draw in a few scenarios, 60 s each (on battery)">Measure power</button>
  </header>
  <table id="results">
    <thead><tr><th>Test</th><th>Median</th><th>Runs</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <p id="status" class="muted">Starting…</p>
  <div id="stage"></div>
  <script src="app.js"></script>
</body>
</html>
