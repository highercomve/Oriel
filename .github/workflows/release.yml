# On a v* tag: run the tests (Linux, macOS, Windows), build the oriel CLI
# for x86_64 and aarch64 Linux (static, musl), macOS and Windows, sign an
# update manifest per target (`oriel update`), and attach the binaries +
# manifests + SHA256SUMS (what install.sh / install.ps1 verify) to the
# GitHub release. Every binary is cross-compiled from the Linux job.
#
# Both jobs run in an Arch Linux container: the prebuilt GTK/WebKit bindings
# target GNOME 50, which Arch ships (Ubuntu LTS runners are too old), and
# configuring Oriel's build already needs pkg-config data from
# wayland/wayland-protocols, even for `zig build cli`.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0
  ARCH_PACKAGES: >-
    git pkgconf gtk4 webkitgtk-6.0 wayland wayland-protocols libxkbcommon
    libxtst libx11 xorg-server-xvfb xorg-xauth dbus ttf-dejavu

jobs:
  test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: System packages
        run: pacman -Syu --noconfirm --needed $ARCH_PACKAGES
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Unit tests (framework, tools, CLI)
        run: zig build test --summary all
      - name: Smoke app, module checks (no GUI)
        working-directory: examples/smoke
        run: zig build && ./zig-out/bin/oriel-smoke --check
        # Portal- and tray-related checks depend on the session (no
        # xdg-desktop-portal or tray host in the container): informative.
        continue-on-error: true
      - name: Smoke app, in-webview checks (Xvfb + private D-Bus)
        working-directory: examples/smoke
        run: ../../scripts/headless.sh ./zig-out/bin/oriel-smoke --auto-quit
        # WebKitGTK's sandbox may not start inside a container: informative.
        continue-on-error: true

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Unit tests (framework, tools, CLI)
        run: zig build test --summary all
      - name: dev_runner cleanup
        run: zig build test-dev-cleanup
      - name: Smoke app, in-webview checks (AppKit + WKWebView)
        working-directory: examples/smoke
        run: zig build && ./zig-out/bin/oriel-smoke --auto-quit
        # CI runners may have no usable window server session: informative.
        continue-on-error: true

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      # Unit tests are gated to Linux/macOS in build.zig; type-check
      # everything and run the CLI natively.
      - name: Type-check (framework, tools, CLI)
        run: zig build check
      - name: CLI
        run: |
          zig build cli
          ./zig-out/bin/oriel.exe --version
      - name: CLI doctor (informative)
        run: ./zig-out/bin/oriel.exe doctor
        continue-on-error: true
      - name: install.ps1 against a local release mirror
        shell: pwsh
        run: |
          $rel = "mirror/download/v0.0.0-ci"
          New-Item -ItemType Directory -Force -Path $rel | Out-Null
          Copy-Item zig-out/bin/oriel.exe "$rel/oriel-x86_64-windows.exe"
          $hash = (Get-FileHash -Algorithm SHA256 "$rel/oriel-x86_64-windows.exe").Hash.ToLowerInvariant()
          Set-Content -Path "$rel/SHA256SUMS" -Value "$hash  oriel-x86_64-windows.exe"
          $server = Start-Process python -ArgumentList '-m','http.server','18766','--bind','127.0.0.1','--directory','mirror' -PassThru
          Start-Sleep -Seconds 2
          try {
            $env:ORIEL_RELEASES_URL = 'http://127.0.0.1:18766'
            $env:ORIEL_VERSION = 'v0.0.0-ci'
            $env:ORIEL_INSTALL_DIR = "$PWD/ci-install"
            ./install.ps1
            ./install.ps1 # again, over the installed exe
            & "$PWD/ci-install/oriel.exe" --version
          } finally {
            Stop-Process -Id $server.Id
          }

  release:
    needs: [test, test-macos, test-windows]
    runs-on: ubuntu-latest
    container: archlinux:latest
    permissions:
      contents: write
    steps:
      - name: System packages
        run: pacman -Syu --noconfirm --needed $ARCH_PACKAGES
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build the CLI
        env:
          TAG: ${{ github.ref_name }}
          PUBLIC_KEY: ${{ vars.ORIEL_UPDATE_PUBLIC_KEY }}
        run: |
          mkdir -p dist
          KEY_FLAG=()
          if [ -n "$PUBLIC_KEY" ]; then
            KEY_FLAG=("-Dupdate-public-key=$PUBLIC_KEY")
          fi
          # <zig target> <os name in asset names> <exe suffix>
          while read -r target os ext; do
            arch="${target%%-*}"
            zig build cli -Dtarget="$target" -Doptimize=ReleaseSafe \
              -Dcli-version="${TAG#v}" -Doriel-ref="$TAG" "${KEY_FLAG[@]}" --prefix "out/$arch-$os"
            cp "out/$arch-$os/bin/oriel$ext" "dist/oriel-$arch-$os$ext"
          done <<'TARGETS'
          x86_64-linux-musl linux
          aarch64-linux-musl linux
          x86_64-macos macos
          aarch64-macos macos
          x86_64-windows windows .exe
          aarch64-windows windows .exe
          TARGETS
          ./dist/oriel-x86_64-linux --version
      - name: Sign release manifests
        env:
          UPDATE_KEY: ${{ secrets.ORIEL_UPDATE_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$UPDATE_KEY" ]; then
            echo "::notice::ORIEL_UPDATE_KEY secret not set; skipping signed update manifests."
            exit 0
          fi
          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s' "$UPDATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          # The manifest target is what the CLI compares with its own
          # (`<arch>-<os>`, see updater_core DEFAULT_TARGET).
          for arch in x86_64 aarch64; do
            for os in linux macos windows; do
              ext=""; [ "$os" = windows ] && ext=".exe"
              asset="oriel-$arch-$os$ext"
              zig build sign-update -- \
                "dist/$asset" \
                --app-id "dev.oriel.cli" \
                --version "${TAG#v}" \
                --target "$arch-$os" \
                --url "https://github.com/highercomve/Oriel/releases/download/$TAG/$asset" \
                --key "$KEY_FILE" \
                --format raw \
                --out "dist/oriel-update-$arch-$os.json"
            done
          done
      - name: Checksums
        run: |
          cd dist && sha256sum oriel-* > SHA256SUMS && cat SHA256SUMS
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # 0.x releases are pre-releases.
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          generate_release_notes: true
