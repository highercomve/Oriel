# The system-monitor example (examples/system-monitor) on each OS it
# supports: its sampler's test run natively (one full sample printed, so a
# run's log shows what Linux, Windows and macOS report), the app built
# with the Oriel renderer (the default: the packages and the update files)
# and the native one (its update files), and its packages, attached to the
# run as artifacts for testing distribution:
#
#   Linux    .deb, .rpm, .AppImage (x86_64)
#   Windows  NSIS setup.exe, and the bare .exe in a zip (x86_64)
#   macOS    .dmg with the .app (arm64; unsigned: right-click > Open)
#
# Run by hand (Actions > System monitor > Run workflow), or on a push that
# touches the example or the native renderer. On a v* tag the packages are
# also attached to that tag's GitHub release (the attach job).
name: System monitor

on:
  workflow_dispatch:
  push:
    paths:
      - "examples/system-monitor/**"
      - "src/native_ui/**"
      - ".github/workflows/system-monitor.yml"

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0
  # As release.yml: the GTK/WebKit bindings target GNOME 50, which Arch ships.
  ARCH_PACKAGES: >-
    git pkgconf gtk4 webkitgtk-6.0 wayland wayland-protocols libxkbcommon
    libxtst libx11 dbus ttf-dejavu squashfs-tools desktop-file-utils go

jobs:
  linux:
    runs-on: ubuntu-latest
    container: ghcr.io/archlinux/archlinux:latest
    defaults:
      run:
        working-directory: examples/system-monitor
    steps:
      - name: System packages
        working-directory: /
        run: pacman -Syu --noconfirm --needed $ARCH_PACKAGES
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: nfpm (for .deb and .rpm)
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Sampler test (one full sample)
        # Zig's own glibc: the container's crt files can be newer than its linker reads.
        run: zig test src/sampler_linux.zig -lc -target x86_64-linux-gnu -OReleaseSafe
      - name: Model tests (histories, process filtering and sorting)
        run: zig build test
      - name: Native renderer build (for its update files)
        run: zig build -Drenderer=native -Doptimize=ReleaseSafe -p zig-out-native --summary all
      - name: Build (the Oriel renderer, the default)
        run: zig build -Drenderer=oriel -Doptimize=ReleaseSafe --summary all
      - name: Packages (.deb, .rpm, .AppImage)
        run: zig build package-deb package-rpm package-appimage -Drenderer=oriel -Doptimize=ReleaseSafe
      - run: ls -la zig-out/package
      # What "Check for updates" installs, named by its manifest target
      # (src/updates.zig): each renderer's executable, and the AppImage.
      - name: Update files
        run: |
          mkdir -p zig-out/update
          gzip -9c zig-out/bin/oriel-system-monitor > zig-out/update/x86_64-linux-oriel.gz
          gzip -9c zig-out-native/bin/oriel-system-monitor > zig-out/update/x86_64-linux-native.gz
          cp zig-out/package/*.AppImage zig-out/update/x86_64-linux-appimage-oriel.AppImage
          ls -la zig-out/update
      - uses: actions/upload-artifact@v4
        with:
          name: system-monitor-linux-x86_64
          path: |
            examples/system-monitor/zig-out/package/*.deb
            examples/system-monitor/zig-out/package/*.rpm
            examples/system-monitor/zig-out/package/*.AppImage
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: system-monitor-update-linux
          path: examples/system-monitor/zig-out/update/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: examples/system-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: NSIS
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress }
      - name: Sampler test (one full sample)
        run: zig test src/sampler_windows.zig -OReleaseSafe
      - name: Model tests (applications, histories, process filtering and sorting)
        run: zig build test
      - name: Native renderer build (for its update files)
        run: zig build -Drenderer=native -Doptimize=ReleaseSafe -p zig-out-native --summary all
      - name: Build (the Oriel renderer, the default)
        run: zig build -Drenderer=oriel -Doptimize=ReleaseSafe --summary all
      - name: Installer (setup.exe) and portable zip
        shell: pwsh
        run: |
          zig build package-nsis -Drenderer=oriel -Doptimize=ReleaseSafe
          Compress-Archive -Path zig-out/bin/* -DestinationPath zig-out/package/oriel-system-monitor-windows-x86_64.zip -Force
          Get-ChildItem zig-out/package
      - name: Update files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force zig-out/update | Out-Null
          Copy-Item zig-out/bin/oriel-system-monitor.exe zig-out/update/x86_64-windows-oriel.exe
          Copy-Item zig-out-native/bin/oriel-system-monitor.exe zig-out/update/x86_64-windows-native.exe
          Get-ChildItem zig-out/update
      - uses: actions/upload-artifact@v4
        with:
          name: system-monitor-windows-x86_64
          path: |
            examples/system-monitor/zig-out/package/*.exe
            examples/system-monitor/zig-out/package/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: system-monitor-update-windows
          path: examples/system-monitor/zig-out/update/*
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: examples/system-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Sampler test (one full sample)
        run: zig test src/sampler_macos.zig -OReleaseSafe
      - name: Model tests (applications, histories, process filtering and sorting)
        run: zig build test
      - name: Native renderer build (for its update files)
        run: zig build -Drenderer=native -Doptimize=ReleaseSafe -p zig-out-native --summary all
      - name: Build (the Oriel renderer, the default)
        run: zig build -Drenderer=oriel -Doptimize=ReleaseSafe --summary all
      - name: Disk image (.app in a .dmg, unsigned)
        run: |
          zig build package-dmg -Drenderer=oriel -Doptimize=ReleaseSafe
          ls -la zig-out/package
      # The .app as a tar (the updater swaps the whole bundle), and each
      # renderer's executable for copies run outside a bundle.
      - name: Update files
        run: |
          mkdir -p zig-out/update
          app=$(find zig-out -maxdepth 4 -type d -name '*.app' | head -1)
          if [ -z "$app" ]; then
            mnt=$(mktemp -d)
            hdiutil attach -nobrowse -readonly -mountpoint "$mnt" zig-out/package/*.dmg
            mkdir -p zig-out/app && cp -R "$mnt"/*.app zig-out/app/
            hdiutil detach "$mnt"
            app=$(find zig-out/app -maxdepth 1 -type d -name '*.app' | head -1)
          fi
          COPYFILE_DISABLE=1 tar -czf zig-out/update/aarch64-macos-oriel.app.tar.gz -C "$(dirname "$app")" "$(basename "$app")"
          gzip -9c zig-out/bin/oriel-system-monitor > zig-out/update/aarch64-macos-oriel-exe.gz
          gzip -9c zig-out-native/bin/oriel-system-monitor > zig-out/update/aarch64-macos-native-exe.gz
          ls -la zig-out/update
      - uses: actions/upload-artifact@v4
        with:
          name: system-monitor-macos-arm64
          path: examples/system-monitor/zig-out/package/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: system-monitor-update-macos
          path: examples/system-monitor/zig-out/update/*
          if-no-files-found: error

  # On a release tag: the packages, named by OS and arch, and their
  # SYSTEM-MONITOR-SHA256SUMS, attached to that tag's GitHub release. The
  # release workflow publishes it (~15 min, this one takes ~4): wait for it.
  attach:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    # Signing runs `zig build sign-update` in Oriel's build, whose
    # configuration needs the Linux job's packages (as release.yml).
    container: ghcr.io/archlinux/archlinux:latest
    permissions:
      contents: write
    steps:
      - name: System packages
        run: pacman -Syu --noconfirm --needed $ARCH_PACKAGES github-cli python
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      # The monitor's version is Oriel's (examples/system-monitor/build.zig.zon,
      # bumped with each release): "Check for updates" compares it.
      - name: The tag is the monitor's version
        run: |
          v=$(sed -n 's/^ *\.version = "\(.*\)",/\1/p' examples/system-monitor/build.zig.zon)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::examples/system-monitor/build.zig.zon is $v, the tag $GITHUB_REF_NAME: bump it with the release" >&2; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Name by OS and arch, and checksum
        run: |
          mkdir up
          cp artifacts/system-monitor-linux-x86_64/* up/
          for f in artifacts/system-monitor-macos-arm64/*.dmg; do
            b=$(basename "$f" .dmg); cp "$f" "up/$b-macos-arm64.dmg"
          done
          for f in artifacts/system-monitor-windows-x86_64/*-setup.exe; do
            b=$(basename "$f" -setup.exe); cp "$f" "up/$b-windows-x86_64-setup.exe"
          done
          # The zip has no version in its name: the installer's gives it.
          version=$(basename up/*-windows-x86_64-setup.exe -windows-x86_64-setup.exe)
          cp artifacts/system-monitor-windows-x86_64/*.zip "up/$version-windows-x86_64.zip"
          cd up && sha256sum oriel-system-monitor* > SYSTEM-MONITOR-SHA256SUMS && cat SYSTEM-MONITOR-SHA256SUMS
      # system-monitor-latest.json: one signed entry per update file, the
      # target taken from its name (src/updates.zig picks this copy's).
      - name: Sign the update manifest
        env:
          UPDATE_KEY: ${{ secrets.ORIEL_UPDATE_KEY }}
        run: |
          if [ -z "$UPDATE_KEY" ]; then
            echo "::notice::ORIEL_UPDATE_KEY secret not set; no system monitor update manifest."
            exit 0
          fi
          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s' "$UPDATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          V="${GITHUB_REF_NAME#v}"
          mkdir -p manifests
          for f in artifacts/system-monitor-update-*/*; do
            name=$(basename "$f")
            case "$name" in
              *.app.tar.gz) target="${name%.app.tar.gz}"; format=app.tar.gz ;;
              *.AppImage)   target="${name%.AppImage}";   format=appimage ;;
              *.exe)        target="${name%.exe}";        format=raw ;;
              *.gz)         target="${name%.gz}";         format=raw.gz ;;
              *) echo "::error::unexpected update file $name" >&2; exit 1 ;;
            esac
            asset="oriel-system-monitor-$V-$name"
            cp "$f" "up/$asset"
            zig build sign-update -- "up/$asset" \
              --app-id dev.oriel.SystemMonitor \
              --version "$V" \
              --target "$target" \
              --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$asset" \
              --key "$KEY_FILE" \
              --format "$format" \
              --out "manifests/$target.json"
          done
          zig build combine-manifests -- manifests/*.json \
            --pub-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --out up/system-monitor-latest.json
          python3 -c "import json,sys; print(sorted(json.load(open(sys.argv[1]))['platforms']))" up/system-monitor-latest.json
      - name: Wait for the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 90); do
            gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exit 0
            sleep 30
          done
          echo "no release for $GITHUB_REF_NAME after 45 minutes" >&2; exit 1
      - name: Attach
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" up/* --clobber -R "$GITHUB_REPOSITORY"
