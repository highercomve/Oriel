name: Build and Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'zine.ziggy'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Zine
        run: |
          curl -sL -o /tmp/zine.tar.xz https://github.com/kristoff-it/zine/releases/download/v0.14.0/x86_64-linux-musl.tar.xz
          tar xJf /tmp/zine.tar.xz -C /tmp/
          chmod +x /tmp/zine
          echo "/tmp" >> $GITHUB_PATH

      - name: Build site
        run: zine release

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public/'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
