<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@@title@@</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Oriel's CSP allows no inline scripts: keep scripts in files. -->
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main>
      <h1>@@title@@</h1>
      <p class="tagline">Plain HTML and JavaScript, with Zig on the other side of invoke().</p>
      <form id="greet-form">
        <input id="name" value="Oriel" placeholder="Your name" />
        <button type="submit">Greet</button>
      </form>
      <p id="greeting" class="greeting"></p>
      <p id="count" class="count">Greeted 0 times (event from Zig)</p>
      <footer id="info"></footer>
    </main>
  </body>
</html>
